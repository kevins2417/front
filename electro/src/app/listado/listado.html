<h1 class="titulo">Nuestros productos</h1>

<div class="tabla-caja">
  <table class="tabla">
    <thead>
      <tr>
        <th>#</th>
        <th>Producto</th>
        <th>Marca</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      @for (p of productos; track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.nombre }}</td>
          <td>{{ p.marca }}</td>
          <td>{{ p.categoria }}</td>
          <td>S/. {{ p.precio }}</td>
          <td>
            @if (p.stock > 0) {
              <span class="badge ok">{{ p.stock }} disponibles</span>
            } @else {
              <span class="badge agotado">Agotado</span>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
